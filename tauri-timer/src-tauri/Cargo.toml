[package]
name = "drift_timer_tauri"
version = "1.0.0"
description = "A tiny floating focus timer"
authors = ["Drift Timer"]
edition = "2021"

[lib]
name = "drift_timer_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.12.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = ["tray-icon"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
