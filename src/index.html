<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" /><title>Drift Timer</title><link rel="stylesheet" href="style.css" /></head>
<body><main class="timer-shell">
  <header class="window-bar"><span class="brand"><i></i> focus timer</span><div class="window-actions"><button id="pin" class="icon-button" title="Toggle always on top" aria-label="Toggle always on top"><span class="pin-icon">&#9670;</span></button><button id="close" class="icon-button close-button" title="Close timer" aria-label="Close timer">&#215;</button></div></header>
  <section class="content"><div class="timer-info"><div class="presets" aria-label="Timer presets"><button data-minutes="5">5 min</button><button data-minutes="10">10 min</button><button data-minutes="20" class="selected">20 min</button></div><p class="label">Remaining</p><output id="time" class="time">20:00</output><div class="controls"><button id="start" class="primary-button"><span class="play-mark">&#9654;</span><span>Start</span></button><button id="reset" class="reset-button" title="Reset timer" aria-label="Reset timer">&#8634;</button></div></div>
  <button id="orb" class="timer-orb" aria-label="Start or pause timer"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="65"></circle><circle id="progress" class="progress" cx="80" cy="80" r="65"></circle></svg><div class="gif-wrap"><img id="pikachu" src="../Pikachu stop.gif" alt="Pikachu timer companion" /></div></button></section>
  <label class="note-wrap" for="note"><span>Note</span><input id="note" maxlength="70" placeholder="What are you focusing on?" autocomplete="off" /></label>
</main><script src="../dist/renderer.js"></script></body></html>
